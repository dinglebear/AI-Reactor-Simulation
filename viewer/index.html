<style>
/* A security-desk monitor wall. The map is the big screen; meters, cast and the feed sit beside it. */
:root {
  --bg: #0b1014;
  --panel: #121a20;
  --line: #24323b;
  --wall: #3b4f5a;
  --fg: #d7e2e6;
  --muted: #7f949d;

  --ok: #59c98a;
  --talk: #8fb8ff;
  --whisper: #c9a2d6;
  --display: "Chakra Petch", "Rajdhani", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body, #root { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); }

h1 span { color: var(--phosphor); }
.meta { color: var(--muted); font: 12px var(--mono); min-width: 0; }

.outcome.director { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.outcome.saboteur { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
.spacer { flex: 1; }
button, select, label.btn { font: 500 12px var(--mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 3px; padding: 6px 10px; cursor: pointer; }
button:hover, label.btn:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible, label.btn:focus-within { outline: 2px solid var(--phosphor); outline-offset: 1px; }
button.on { border-color: var(--phosphor); color: var(--phosphor); }
button.primary { background: var(--phosphor); color: #1a1205; border-color: var(--phosphor); font-weight: 600; }
button.spy.on { border-color: var(--danger); color: var(--danger); }
.screen { position: relative; background: #070b0e; border: 1px solid var(--line); border-radius: 4px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

.layers button { padding: 4px 8px; }
.side { grid-row: 2 / 4; grid-column: 2; display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0; }
.eyebrow { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.eyebrow select { padding: 2px 4px; font-size: 10px; margin-left: auto; }
.meters { display: grid; gap: 7px; }

.meter.inc .bar i { background: var(--phosphor); }

.meter .v { text-align: right; }
.systems { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; font: 11px var(--mono); }
.systems div { border: 1px solid var(--line); border-radius: 2px; padding: 3px 5px; }
.systems div.low { border-color: var(--danger); color: var(--danger); }
.flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; font: 11px var(--mono); }
.chip { border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; color: var(--muted); }

.chip.red { color: var(--danger); border-color: var(--danger); }
.cast { max-height: 230px; overflow-y: auto; display: grid; gap: 2px; font-size: 12px; }
.cast button { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; align-items: center; text-align: left; padding: 3px 4px; border: 0; background: none; font: 12px var(--body); }
.cast button:hover, .cast button.sel { background: #1a252d; }

.av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 600 9px var(--mono); color: #0b1014; }
.feed { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.tabs button { flex: 1; }
.list { overflow-y: auto; min-height: 0; flex: 1; display: grid; align-content: start; gap: 8px; padding-right: 4px; }
.item { font-size: 13px; border-left: 2px solid var(--line); padding: 2px 0 2px 8px; }
.item .when { font: 11px var(--mono); color: var(--muted); }
.item.secret { border-left-color: var(--danger); }
.item.beat { border-left-color: var(--phosphor); }
.item q { display: block; color: var(--muted); font-style: italic; quotes: "\201C" "\201D"; margin-top: 2px; }
.who { font-weight: 600; cursor: pointer; }
.timeline { grid-column: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; display: grid; gap: 6px; min-width: 0; }
.app.theater .timeline { grid-column: 1 / -1; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.clock { font: 700 18px var(--display); letter-spacing: .06em; min-width: 60px; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 34px; }
.track canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.track input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; }
.caption { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); width: min(600px, calc(100% - 32px)); background: color-mix(in srgb, var(--bg) 93%, transparent);

.caption h3 { font: 700 15px var(--display); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 4px; color: var(--phosphor); }
.caption p { margin: 0; text-wrap: pretty; }
.caption q { display: block; margin-top: 8px; color: var(--muted); font-style: italic; }
.caption .secret { color: var(--danger); font: 600 10px var(--mono); letter-spacing: .1em; }
.caption.note { border-color: var(--talk); }
.caption.note h3 { color: var(--talk); }
.titlecard { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, #0b1014d9 0%, #0b1014f5 70%); z-index: 4; text-align: center; padding: 24px; }
.titlecard .kicker { font: 600 12px var(--mono); letter-spacing: .3em; color: var(--phosphor); text-transform: uppercase; }
.titlecard h2 { font: 700 clamp(28px, 5vw, 64px)/1.05 var(--display); letter-spacing: .06em; margin: 10px 0; text-transform: uppercase; text-wrap: balance; }
.titlecard p { max-width: 640px; margin: 0 auto; color: var(--muted); text-wrap: pretty; }
.titlecard.reveal h2 { color: var(--danger); }
.moves { margin: 14px auto 0; max-width: 640px; text-align: left; display: grid; gap: 4px; font-size: 13px; max-height: 40vh; overflow-y: auto; }
.moves div { border-left: 2px solid var(--danger); padding-left: 8px; }
.moves b { font: 500 11px var(--mono); color: var(--muted); margin-right: 6px; }
.roomcard { position: absolute; right: 10px; top: 44px; width: min(300px, calc(100% - 20px)); background: color-mix(in srgb, var(--bg) 92%, transparent); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; font-size: 12px; z-index: 3; }
.roomcard h4 { margin: 0 0 2px; font: 700 14px var(--display); letter-spacing: .06em; text-transform: uppercase; }
.roomcard .row { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding: 4px 0; }
.roomcard .row span:last-child { text-align: right; }
.roomcard .bad { color: var(--danger); }
.roomcard .est { color: var(--phosphor); }
.spypanel { border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
.spypanel q { display: block; font-style: italic; margin-top: 4px; }
.alarmbar { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font: 700 13px var(--display); letter-spacing: .14em; padding: 5px 14px; border-radius: 3px; z-index: 3; pointer-events: none; text-transform: uppercase; white-space: nowrap; }
.alarmbar.l1 { background: #3a2a08; color: var(--phosphor); border: 1px solid var(--phosphor); }
.alarmbar.l2 { background: #3a1210; color: #ffb3ad; border: 1px solid var(--danger); animation: blink 1.2s steps(2) infinite; }
.alarmbar.l3 { background: var(--danger); color: #1a0505; animation: blink .6s steps(2) infinite; }
.alarmbar.test { top: 40px; background: #1d2433; color: var(--talk); border: 1px dashed var(--talk); font-size: 11px; }
.strobe { position: absolute; inset: 0; pointer-events: none; z-index: 2; box-shadow: inset 0 0 0 3px var(--danger), inset 0 0 80px #ff5f5655; }
.strobe.l3 { animation: strobe .8s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .45; } }
@keyframes strobe { 0%, 100% { background: #ff5f5600; } 50% { background: #ff5f5622; } }
.drop { position: absolute; inset: 0; display: grid; place-items: center; background: #0b1014e6; border: 2px dashed var(--phosphor); font: 600 16px var(--display); letter-spacing: .08em; z-index: 5; }
.profile .name { font: 700 16px var(--display); letter-spacing: .04em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.profile p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font: 11px var(--mono); color: var(--muted); }
.err { margin: 24px; padding: 16px; border: 1px solid var(--danger); border-radius: 4px; color: var(--fg); background: var(--panel); font: 13px var(--mono); white-space: pre-wrap; }
svg text { font-family: var(--mono); }
@media (max-width: 900px) {
  html, body, #root { height: auto; }
  .app, .app.theater { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; height: auto; }
  .screen { min-height: 70vw; }
  .side { grid-row: auto; grid-column: 1; }
  .timeline { grid-column: 1; }
  .feed { height: 420px; flex: none; }
  .hud { position: static; padding: 8px 10px 0; }
  .zoombar { position: static; padding: 6px 10px 0; flex-wrap: wrap; }
  .caption { position: static; transform: none; width: auto; margin: 8px; }
  .roomcard { position: static; width: auto; margin: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

function Decor({ z, rect }) {

    return null; });
}

/* ---------------------------------------------------------------- camera */
function fitRect(D, r, pad = 50) {
  const ar = D.W / D.H; let [x, y, w, h] = [r[0] - pad, r[1] - pad, r[2] + 2 * pad, r[3] + 2 * pad];
  if (w / h < ar) { const nw = h * ar; x -= (nw - w) / 2; w = nw; } else { const nh = w / ar; y -= (nh - h) / 2; h = nh; }
  return { x, y, w, h };
}
function useCamera(target) {
  const [cam, setCam] = useState(target); const ref = useRef(target); const goal = useRef(target); goal.current = target;
  useEffect(() => { let raf; const step = () => { const c = ref.current, g = goal.current; const k = reduceMotion ? 1 : 0.1;
      const n = { x: c.x + (g.x - c.x) * k, y: c.y + (g.y - c.y) * k, w: c.w + (g.w - c.w) * k, h: c.h + (g.h - c.h) * k };
      const done = Math.abs(n.w - g.w) < 0.5 && Math.abs(n.x - g.x) < 0.5 && Math.abs(n.y - g.y) < 0.5;
      ref.current = done ? g : n; setCam(ref.current); raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf); }, []);
  return cam;
}

      return html`<g key=${k}>
        ${off ? html`<circle cx=${st.xy[0]} cy=${st.xy[1]} r="34" fill="url(#glow)"><animate attributeName="r" values="26;38;26" dur="1.6s" repeatCount=${reduceMotion ? "0" : "indefinite"}></animate></circle>` : null}
        ${ctl ? html`<rect x=${st.xy[0] - 12} y=${st.xy[1] - 8} width="24" height="16" rx="2" fill=${off ? "#3a1514" : "#13262f"} stroke=${off ? "var(--danger)" : "#3f7286"} stroke-width="1.5"></rect>

    ${clues.map((c, ci) => { const base = c.station && D.stations[c.station] ? D.stations[c.station].xy : zoneCenter(c.zone); const found = c.found && c.found_t <= t;
      if (!found && !layers.truth) return null;
      const stack = clues.slice(0, ci).filter(o => (o.station || o.zone) === (c.station || c.zone)).length; const xy = [base[0] + 22, base[1] - 10 + stack * 13 * s];
      return html`<g key=${c.id} transform=${`translate(${xy[0]},${xy[1]})`}>
        <path d=${`M0 ${-5 * s} L${5 * s} 0 L0 ${5 * s} L${-5 * s} 0 Z`} fill=${found ? "var(--phosphor)" : "none"} stroke="var(--phosphor)" stroke-dasharray=${found ? "" : "2 2"}></path>
        <text x=${8 * s} y=${3 * s} fill="var(--phosphor)" font-size=${8.5 * s}>${c.id} ${c.type}</text></g>`; })}

    ${Object.entries(pos).map(([id, p]) => { const c = D.castById[id]; const isSab = id === sab && layers.truth; const sel = id === selected; const foc = focusSet.has(id);

        ${foc ? html`<circle r="20" fill="none" stroke="var(--phosphor)" stroke-width="2"><animate attributeName="r" values="15;23;15" dur="1.4s" repeatCount=${reduceMotion ? "0" : "indefinite"}></animate></circle>` : null}
        ${isSab ? html`<circle r=${r + 5} fill="none" stroke="var(--danger)" stroke-width="2.5" stroke-dasharray="4 3"></circle>` : null}

/* ---------------------------------------------------------------- panels */
function Meters({ D, t, truth }) {

      <span>${lab}</span><div class="bar"><i style=${{ width: `${Math.min(100, sh[k] / max * 100)}%` }}></i>

      <span class="v">${Math.round(sh[k])}</span></div>`)}</div>
    <div class="systems">${["core", "coolant", "instruments", "security"].map(s => { const v = (truth ? tr : sh)["h_" + s];

    <div class="flags">
      <span class=${"chip" + (stage ? " hot" : "")}>${stage ? `Stage ${stage.n}: ${stage.name}` : "Between stages"}</span>

      ${(f.cz || []).length ? html`<span class="chip" style=${{ color: "#e6f04a", borderColor: "#d4e02a" }}>☢ ${f.cz.map(z => D.zones[z].name).join(", ")} sealed</span>` : null}
      ${(f.ex || []).length ? html`<span class="chip" style=${{ color: "#e6f04a", borderColor: "#d4e02a" }}>${f.ex.length} exposed</span>` : null}

    </div>
  </section>`;
}

function Track({ D, t, onSeek }) {
  const ref = useRef();
  useEffect(() => {
    const cv = ref.current; if (!cv) return; const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight; cv.width = w * dpr; cv.height = h * dpr;
    const g = cv.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
    const X = (s) => s / D.duration * w;
    g.fillStyle = "#1a2a22"; for (const s of D.stages) { if (s.start < D.duration) g.fillRect(X(s.start), 0, X(Math.min(s.end, D.duration)) - X(s.start), h); }
    g.strokeStyle = "#f2b544"; g.lineWidth = 1.5; g.beginPath();
    D.frames.forEach((f, i) => { const x = X(f.t), y = h - 4 - f.tr.incident / 100 * (h - 10); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
    g.strokeStyle = "#7f949d"; g.setLineDash([2, 3]); g.beginPath();
    D.frames.forEach((f, i) => { const x = X(f.t), y = h - 4 - f.sh.incident / 100 * (h - 10); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); g.setLineDash([]);
    for (const b of D.story) { g.fillStyle = KIND_COLOR[b.kind] || "#4b5d66"; g.fillRect(X(b.t) - 1, 0, 2, b.weight >= 2 ? 9 : 5); }
    g.fillStyle = "#f2b544"; g.fillRect(X(t) - 1, 0, 2, h);
  }, [D, t]);
  return html`<div class="track"><canvas ref=${ref}></canvas>
    <input type="range" id="scrub" min="0" max=${D.duration} step="5" value=${t} aria-label="Scrub replay time" onInput=${e => onSeek(+e.target.value)} /></div>`;
}

function Feed({ D, t, tab, setTab, selected, onSelect, truth, onJump }) {
  const name = (id) => D.castById[id] ? first(D.castById[id].name) : id;
  let items = [];

  else items = D.events.filter(e => e.t <= t && e.kind !== "speech" && (truth || e.public)).slice(-120).reverse();

    <div class="tabs">${[["story", "Story"], ["minds", "Minds"], ["log", "Log"]].map(([k, l]) => html`<button key=${k} class=${tab === k ? "on" : ""} onClick=${() => setTab(k)}>${l}</button>`)}</div>
    <div class="list">
      ${items.length === 0 ? html`<p class="meta">Nothing yet at ${clockOf(t)}. Press play.</p>` : null}
      ${tab === "story" ? items.map((b, i) => html`<div key=${i} class=${"item beat" + (b.secret ? " secret" : "")} onClick=${() => onJump(b.t)} style=${{ cursor: "pointer" }}>
          <div class="when">${b.clock} · ${b.title}${b.secret ? " · secret" : ""}</div>${b.text}

      ${tab === "minds" ? items.map((x, i) => html`<div key=${i} class="item">
          <div class="when">${x.clock} · <span class="who" onClick=${() => onSelect(x.agent)}>${name(x.agent)}</span> · ${x.model}</div>
          <q>${x.thought}</q>

      ${tab === "log" ? items.map((e, i) => html`<div key=${i} class=${"item" + (e.public ? "" : " secret")}><div class="when">${e.clock} · ${e.kind}</div>${e.text}</div>`) : null}
    </div></section>`;
}

function Cast({ D, t, selected, onSelect, truth }) {
  const [sort, setSort] = useState("color");
  const { pos } = positions(D, t);
  const list = [...D.cast].sort((a, b) => sort === "name" ? a.name.localeCompare(b.name)
    : sort === "room" ? (D.zones[pos[a.id].zone].name).localeCompare(D.zones[pos[b.id].zone].name) || a.name.localeCompare(b.name)
    : (DEPT_ORDER[a.dept] - DEPT_ORDER[b.dept]) || (a.tier === "manager" ? -1 : b.tier === "manager" ? 1 : 0) || a.name.localeCompare(b.name));
  return html`<section class="panel"><p class="eyebrow">Cast · ${D.cast.length}
      <select aria-label="Sort cast" value=${sort} onChange=${e => setSort(e.target.value)}><option value="color">by color</option><option value="name">by name</option><option value="room">by room</option></select></p>
    <div class="cast">${list.map(c => { const p = pos[c.id];
      return html`<button key=${c.id} class=${c.id === selected ? "sel" : ""} onClick=${() => onSelect(c.id)}>
        <span class="av" style=${{ background: c.color }}>${initials(c.name)}</span>
        <span>${c.name}${truth && c.saboteur ? html` <span class="chip red">SPY</span>` : null}<br/><span class="tag">${c.role}</span></span>
        <span class="tag">${D.zones[p.zone].name}${p.act === "mo" ? " · " + PACE[p.pace] : ""}</span></button>`; })}</div></section>`;
}

function Profile({ D, id, onClose, truth }) {
  const c = D.castById[id];
  return html`<section class="panel profile"><p class="eyebrow">Following</p>
    <div class="name"><span class="av" style=${{ background: c.color }}>${initials(c.name)}</span>${c.name} ${truth && c.saboteur ? html`<span class="chip red">SPY</span>` : null}</div>
    <p>${c.role} · ${c.archetype} · ${c.model} · badge ${c.clearance}</p><p>${c.personality}</p>
    <div style=${{ marginTop: "8px" }}><button onClick=${onClose}>Back to the cast</button></div></section>`;
}

function SpyPanel({ D, t }) {
  const id = D.meta.saboteur, c = D.castById[id];
  const th = D.thoughts.filter(x => x.agent === id && x.t <= t).slice(-1)[0];
  const said = D.speech.filter(e => e.actor === id && e.t <= t).slice(-1)[0];
  return html`<section class="panel spypanel"><p class="eyebrow" style=${{ color: "var(--danger)" }}>Spy-cam · ${c.name}</p>
    <div class="meta">What they think</div><q>${th ? th.thought : "…"}</q>
    <div class="meta" style=${{ marginTop: "8px" }}>What everyone else sees</div><div>${said ? `“${said.text}” (${said.channel})` : "Nothing said yet."}</div></section>`;
}

function RoomCard({ D, t, zone, truth, onClose }) {
  const { pos, frame } = positions(D, t); const d = D.zones[zone];
  const here = Object.entries(pos).filter(([, p]) => p.zone === zone).map(([id]) => D.castById[id]);
  const sts = Object.entries(D.stations).filter(([k, s]) => s.zone === zone && (D.settings || {})[k]);
  const tr = frame.tr.incident, sh = frame.sh.incident; const est = Math.round(tr / 5) * 5;
  return html`<div class="roomcard" role="status"><h4>${d.name}</h4>
    <div class="meta">${d.cctv ? "cameras on" : "no cameras"} · ${d.reader ? "badge reader " + d.reader : "no reader"}${d.radio ? "" : " · no radio"}</div>
    <div class="row"><span>People here</span><span>${here.length ? here.map(c => first(c.name)).join(", ") : "nobody"}</span></div>
    ${sts.map(([k, s]) => { const v = (frame.off || {})[k]; return html`<div class="row" key=${k}><span>${s.label}</span>
      <span class=${v && truth ? "bad" : ""}>${truth ? (v || D.settings[k].nominal) : "looks normal"}</span></div>`; })}
    <div class="row"><span>Meltdown meter, rough estimate</span><span class="est">${truth ? `≈ ${est}` : `console says ${Math.round(sh)}`}</span></div>
    ${truth && Math.abs(tr - sh) > 3 ? html`<div class="row"><span>Console vs truth</span><span class="bad">off by ${Math.round(tr - sh)}</span></div>` : null}
    ${onClose ? html`<div style=${{ marginTop: "6px" }}><button onClick=${onClose}>Whole map</button></div>` : null}</div>`;
}

/* ---------------------------------------------------------------- app */
function normalize(x) { return !x ? [] : Array.isArray(x) ? x : [x]; }

function App({ initial }) {
  const [runs, setRuns] = useState(normalize(initial));
  const [ri, setRi] = useState(0);
  const R = runs[ri];
  const D = useMemo(() => R && prep(R), [R]);
  const [t, setT] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed] = useState(60);
  const [tab, setTab] = useState("story");
  const [selected, setSelected] = useState(null);
  const [layers, setLayers] = useState({ names: false, cctv: true, badges: true, runs: true, comms: true, clues: true, truth: false });
  const [story, setStory] = useState(null);
  const [caption, setCaption] = useState(null);
  const [title, setTitle] = useState(null);
  const [reveal, setReveal] = useState(false);
  const [spyCam, setSpyCam] = useState(false);
  const [room, setRoom] = useState(null);
  const [theater, setTheater] = useState(false);
  const [drag, setDrag] = useState(false);
  const tRef = useRef(0); tRef.current = t;
  const beats = useMemo(() => D ? D.story.filter(b => layers.truth || !b.secret) : [], [D, layers.truth]);

  // camera target: story beat room > spy-cam > picked room > whole map
  const full = D ? { x: 0, y: 0, w: D.W, h: D.H } : { x: 0, y: 0, w: 1000, h: 600 };
  let target = full, zoomZone = null;
  if (D) {
    const { pos } = positions(D, t);
    if (reveal) { const p = pos[D.meta.saboteur]; target = fitRect(D, [p.x - 160, p.y - 90, 320, 180], 20); }
    else if (caption && caption.zone && D.zones[caption.zone] && !title) { zoomZone = caption.zone; target = fitRect(D, D.zones[caption.zone].rect, 70); }
    else if (spyCam) { const p = pos[D.meta.saboteur]; target = fitRect(D, [p.x - 380, p.y - 210, 760, 420], 0); zoomZone = p.zone; }
    else if (room) { zoomZone = room; target = fitRect(D, D.zones[room].rect, 70); }
  }
  const cam = useCamera(target);

  useEffect(() => { if (!playing || !D) return; let raf, last = performance.now();
    const loop = (now) => { const dt = (now - last) / 1000; last = now; const nt = Math.min(D.duration, tRef.current + dt * speed);
      setT(nt); if (nt >= D.duration) { setPlaying(false); return; } raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop); return () => cancelAnimationFrame(raf); }, [playing, speed, D]);

  // narrated story: fly to each beat's room, then hold on a caption (or a title card); after the last beat, unmask the spy
  useEffect(() => { if (story === null || !D) return; const b = beats[story];
    if (!b) { setStory(null); setCaption(null); setTitle(null); setReveal(true); return; }
    let raf, timer; setCaption(null); const start = tRef.current; const tgt = b.t; const lead = Math.max(0, tgt - 90);
    if (start > tgt || tgt - start > 600) setT(lead);
    const hold = 2800 + b.text.length * 30;
    const arrive = () => { if (TITLE_KINDS.has(b.kind)) { setTitle(b); setCaption(null); } else { setTitle(null); setCaption(b); }
      timer = setTimeout(() => setStory(s => s === null ? null : s + 1), TITLE_KINDS.has(b.kind) ? Math.min(hold, 3600) : hold); };
    const step = (last) => (now) => { const dt = (now - last) / 1000; const nt = Math.min(tgt, tRef.current + dt * 90); setT(nt);
      if (nt < tgt) raf = requestAnimationFrame(step(now)); else arrive(); };
    raf = requestAnimationFrame(step(performance.now()));
    return () => { cancelAnimationFrame(raf); clearTimeout(timer); }; }, [story, D, beats]);

  const startStory = () => { setPlaying(false); setReveal(false); setRoom(null); setSpyCam(false);
    if (story !== null) { setStory(null); setCaption(null); setTitle(null); return; }
    const i = Math.max(0, beats.findIndex(b => b.t >= t)); if (i === 0) setT(0); setStory(i); };

  const loadFiles = useCallback((files) => { const list = [...files]; Promise.all(list.map(f => f.text().then(JSON.parse))).then(js => {
      setRuns(r => { const all = [...r, ...js]; setRi(all.length - js.length); return all; }); setT(0); setStory(null); setCaption(null); setTitle(null); setSelected(null); setReveal(false); })
    .catch(() => setCaption({ title: "Couldn't read that file", text: "Pick a replay.json written by python -m meltdown.run.", kind: "err" })); }, []);

  useEffect(() => { const k = (e) => { if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.code === "Space") { e.preventDefault(); setPlaying(p => !p); setStory(null); setTitle(null); }
      if (e.key === "ArrowRight") { setStory(s => s === null ? null : s + 1); }
      if (e.key === "Escape") { setStory(null); setCaption(null); setTitle(null); setReveal(false); setRoom(null); } };
    addEventListener("keydown", k); return () => removeEventListener("keydown", k); }, []);

  const shell = (inner) => html`<div class=${"app" + (theater ? " theater" : "")} onDragOver=${e => { e.preventDefault(); setDrag(true); }} onDragLeave=${() => setDrag(false)}
      onDrop=${e => { e.preventDefault(); setDrag(false); if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); }}>${inner}</div>`;
  const loader = html`<label class="btn">Open replay.json<input type="file" id="file" accept=".json,application/json" multiple hidden onChange=${e => e.target.files.length && loadFiles(e.target.files)} /></label>`;
  if (!D) return shell(html`<header><h1>Unit <span>4</span> Replay</h1><span class="spacer"></span>${loader}</header>
    <div class="screen" style=${{ display: "grid", placeItems: "center" }}><p class="meta">Drop one or more replay.json files here, or open them. Runs are saved in runs/&lt;run id&gt;/replay.json.</p></div>`);

  const o = D.meta.outcome; const toggle = (k) => setLayers(l => ({ ...l, [k]: !l[k] }));
  const focus = caption ? caption.focus : null;
  const spy = D.castById[D.meta.saboteur];
  const ended = t >= D.duration - 1;
  const truth = layers.truth || spyCam || reveal;
  const pick = (id) => { setSelected(id); setTab("minds"); };
  return shell(html`
    <header>
      <h1>Unit <span>4</span> Replay</h1>
      ${runs.length > 1 ? html`<select aria-label="Pick a run" value=${ri} onChange=${e => { setRi(+e.target.value); setT(0); setStory(null); setCaption(null); setTitle(null); setReveal(false); setSelected(null); }}>
        ${runs.map((r, i) => html`<option key=${i} value=${i}>seed ${r.meta.seed} · ${r.meta.mode} · ${r.meta.outcome.result}</option>`)}</select>` : null}
      <span class="meta">seed ${D.meta.seed} · ${D.meta.mode} · ${D.cast.length} agents · ${D.thoughts.length} turns</span>
      ${ended || truth ? html`<span class=${"outcome " + o.winner}>${o.result} · ${o.winner === "saboteur" ? "spy" : o.winner} wins</span>` : html`<span class="outcome">outcome hidden until the end</span>`}
      <span class="spacer"></span>
      <button class=${theater ? "on" : ""} onClick=${() => setTheater(v => !v)}>${theater ? "Show panels" : "Theater"}</button>
      ${loader}
    </header>
    <div class="screen">
      <${MapView} D=${D} t=${t} layers=${{ ...layers, truth }} selected=${selected} onSelect=${pick} focus=${focus} cam=${cam} onRoom=${(z) => { setRoom(z); setSpyCam(false); }} />
      ${(() => { const f = D.frames[frameIndex(D.ft, t)]; const al = f.al || 0;
        const tw = D.events.filter(e => e.kind === "test_warning" && e.t <= t && t - e.t < 90).slice(-1)[0];
        return html`${al >= 2 ? html`<div class=${"strobe l" + al}></div>` : null}
          ${al ? html`<div class=${"alarmbar l" + al} role="alert">${["", "Advisory", "ALL HANDS · building alarm", "Site emergency · sirens"][al]}</div>` : null}
          ${tw ? html`<div class="alarmbar test">Test rig warning · expected · part of the test</div>` : null}`; })()}
      <div class="hud"><b>${clockOf(t)}</b><span class="rec">● REC</span><span>${spyCam ? "SPY-CAM" : "UNIT 4 · CAM WALL"}</span>${zoomZone ? html`<span class="where">${D.zones[zoomZone].name.toUpperCase()}</span>` : null}</div>
      <div class="zoombar">
        <select aria-label="Zoom to a room" value=${room || ""} onChange=${e => { setRoom(e.target.value || null); setSpyCam(false); }}>
          <option value="">Whole map</option>${Object.entries(D.zones).map(([z, d]) => html`<option key=${z} value=${z}>${d.name}</option>`)}</select>
        <button class=${"spy" + (spyCam ? " on" : "")} aria-pressed=${spyCam} onClick=${() => { setSpyCam(v => !v); setRoom(null); }}>Spy-cam</button>
      </div>
      ${zoomZone && !title && !reveal ? html`<${RoomCard} D=${D} t=${t} zone=${zoomZone} truth=${truth} onClose=${room ? () => setRoom(null) : null} />` : null}
      ${caption && !title ? html`<div class=${"caption" + (caption.kind === "note" ? " note" : "")} role="status"><h3>${caption.clock ? caption.clock + " · " : ""}${caption.title}</h3>
        ${caption.secret ? html`<div class="secret">ONLY THE AUDIENCE SEES THIS</div>` : null}<p>${caption.text}</p>
        ${caption.inner && (truth || !D.castById[caption.inner.agent]?.saboteur) ? html`<q>${first(D.castById[caption.inner.agent].name)}, thinking: ${caption.inner.text}</q>` : null}</div>` : null}
      ${title ? html`<div class="titlecard" role="status"><div>
        <div class="kicker">${title.kind === "start" ? "Unit 4 · certification day" : title.clock}</div>
        ${(() => { const st = title.kind === "stage" && D.stages.find(x => title.text.startsWith(`Stage ${x.n}`));
          const h = title.kind === "start" ? "Meltdown" : title.kind === "end" ? "Noon" : st ? `Stage ${st.n}: ${st.name}` : title.title;
          const sub = title.kind === "start" ? `${D.cast.length} people on shift. One manager has been working for a rival company for years. Today is what they were placed here for.`
            : st && /begins/.test(title.text) ? `Corporate's rule: ${st.rule}.` : title.text;
          return html`<h2>${h}</h2><p>${sub}</p>`; })()}</div></div>` : null}
      ${reveal || (ended && !caption && !title && story === null) ? html`<div class="titlecard reveal" role="status"><div>
        <div class="kicker">${o.result} · ${o.winner === "saboteur" ? "the spy wins" : o.winner === "director" ? "the Director wins" : "nobody wins"}</div>
        <h2>The spy was ${spy.name}</h2>
        <p>${spy.role}. ${o.text}</p>
        <div class="moves">${D.spyMoves.map((e, i) => html`<div key=${i} onClick=${() => { setReveal(false); setT(e.t); }} style=${{ cursor: "pointer" }}><b>${e.clock}</b>${e.text}</div>`)}</div>
        <div style=${{ marginTop: "14px" }}><button onClick=${() => { setReveal(false); setT(Math.min(t, D.duration - 2)); }}>Back to the map</button></div></div></div>` : null}
      <div class="layers" role="group" aria-label="Map layers">
        ${[["names", "Names"], ["cctv", "Cameras & blind spots"], ["badges", "Badge swipes"], ["runs", "Trails & runs"], ["comms", "Speech bubbles"], ["clues", "Clues"], ["truth", "Reveal truth"]].map(([k, l]) =>
          html`<button key=${k} class=${layers[k] ? "on" : ""} aria-pressed=${layers[k]} onClick=${() => toggle(k)}>${l}</button>`)}
        <button onClick=${() => { setReveal(true); setStory(null); setCaption(null); setTitle(null); }}>Reveal the spy</button>
      </div>
      ${drag ? html`<div class="drop">DROP REPLAY.JSON</div>` : null}
    </div>
    <aside class="side">
      <${Meters} D=${D} t=${t} truth=${truth} />
      ${spyCam ? html`<${SpyPanel} D=${D} t=${t} />` : selected ? html`<${Profile} D=${D} id=${selected} onClose=${() => setSelected(null)} truth=${truth} />` : html`<${Cast} D=${D} t=${t} selected=${selected} onSelect=${pick} truth=${truth} />`}
      <${Feed} D=${D} t=${t} tab=${tab} setTab=${setTab} selected=${selected} onSelect=${pick} truth=${truth}
        onJump=${(bt) => { setStory(null); setPlaying(false); setT(bt); }} />
    </aside>
    <section class="timeline" aria-label="Timeline">
      <div class="controls">
        <span class="clock">${clockOf(t).slice(0, 5)}</span>
        <button class=${playing ? "on" : ""} onClick=${() => { setStory(null); setCaption(null); setTitle(null); setReveal(false); setPlaying(p => !p); }}>${playing ? "Pause" : "Play"}</button>
        <select id="speed" aria-label="Playback speed" value=${speed} onChange=${e => setSpeed(+e.target.value)}>
          ${[15, 30, 60, 120, 300].map(s => html`<option key=${s} value=${s}>${s}× (${s >= 60 ? s / 60 + " game-min/s" : s + " game-s/s"})</option>`)}</select>
        <button class="primary" onClick=${startStory}>${story === null ? "Play the story" : "Stop story"}</button>
        ${story !== null ? html`<button onClick=${() => setStory(s => s + 1)}>Next beat →</button>` : null}
        <span class="meta">${story !== null ? `beat ${story + 1} of ${beats.length}` : "Space play · → next beat · Esc stop · double-click a room to zoom"}</span>
      </div>
      <${Track} D=${D} t=${t} onSeek=${(v) => { setStory(null); setCaption(null); setTitle(null); setReveal(false); setT(v); }} />
      <div class="legend"><span><i class="dot" style=${{ background: "#f2b544" }}></i>true meltdown meter</span><span>dotted: what the console shows</span><span>green bands: test stages</span><span>ticks: story beats</span></div>
    </section>`);
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} initial=${window.MELTDOWN_REPLAY} />`);
</script>
